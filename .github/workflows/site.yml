name: canonical-site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with GitHub Pages dependency set
        run: bundle exec jekyll build --strict_front_matter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate writing audit, built routes, and local links
        run: python scripts/validate_site.py
      - name: Serve built site and smoke-test key routes
        run: |
          python -m http.server 8080 --directory _site >/tmp/site-http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          for path in \
            / \
            /blog/ \
            /research/ \
            /about/ \
            /research-standard/ \
            /blog/197-tests-four-real-hardware-bugs/ \
            /blog/static-analysis-scores-zero-on-real-exploits/ \
            /blog/greedy-was-enough-active-learning-pretrained-potential/ \
            /blog/autograd-is-part-of-the-api/ \
            /blog/delete-the-science-fiction-parts-first/; do
            curl --fail --silent --show-error "http://127.0.0.1:8080${path}" >/dev/null
          done
