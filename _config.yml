title: Tsolmondorj Natsagdorj
tagline: systems & research
description: >-
  Systems and research engineering across reliable AI, high-performance networking,
  scientific ML, autonomous systems, and security-critical infrastructure. Writing,
  open source, experiments, and postmortems focused on hidden failure modes.
author: Tsolmondorj Natsagdorj
email: "layerinfinite@gmail.com"
url: "https://0xsoftboi.github.io"
location: Washington, DC

# Social / links
twitter: 0xSoftBoi
github: 0xSoftBoi
website: https://suwappu.bot

# Build
future: true
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 2..3
permalink: /blog/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social-share image; posts may override with a per-post card.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/default.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _charts
