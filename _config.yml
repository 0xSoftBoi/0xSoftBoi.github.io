title: Tsolmondorj Natsagdorj
tagline: security & systems
description: >-
  Tsolmondorj Natsagdorj — security & systems engineer working on cross-chain
  infrastructure and smart-contract security, with merged contributions to
  alloy and uutils/coreutils. Writing, open source, and selected work.
author: Tsolmondorj Natsagdorj
email: "layerinfinite@gmail.com"
url: "https://0xsoftboi.github.io"
location: Washington, DC

# Social / links
twitter: 0xSoftBoi
github: 0xSoftBoi
website: https://suwappu.bot

# Build
future: true            # publish same-day posts whose timestamp is ahead of the UTC build clock
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true          # heading IDs for in-page TOC anchors
  toc_levels: 2..3
permalink: /blog/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social-share image; posts override with their own per-post card.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/default.png

# Pagination not needed yet; keep it simple
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _charts
