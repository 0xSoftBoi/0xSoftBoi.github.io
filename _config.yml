title: 0xSoftBoi
tagline: security & systems
description: >-
  0xSoftBoi — engineer working on cross-chain infrastructure, smart-contract
  security, and AI agents. Writing, open source, and selected work.
author: 0xSoftBoi
email: ""
url: "https://0xsoftboi.github.io"
location: Washington, DC

# Social / links
twitter: 0xSoftBoi
github: 0xSoftBoi
website: https://suwappu.bot

# Build
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true          # heading IDs for in-page TOC anchors
  toc_levels: 2..3
permalink: /blog/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social-share image; posts override with their own per-post card.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/default.png

# Pagination not needed yet; keep it simple
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _charts
