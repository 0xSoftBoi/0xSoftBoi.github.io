greedy-was-enough-active-learning-pretrained-potential:
  status: revised
  label: revised research note
  reviewed: 2026-08-08
  note: "The original version treated Greedy≈UCB as evidence that the uncertainty signal was useful or the pretrained surrogate was well calibrated. Direct calibration later found readout-level MC-dropout σ anti-correlated with absolute error (Spearman −0.47) on the current perovskite benchmark. The article is revised in place: the mean prediction is useful; this uncertainty estimate is not under the tested configuration."
