  primary_label: active-materials-discovery
static-analysis-scores-zero-on-real-exploits:
  status: revised
  label: revised evaluation postmortem
  reviewed: 2026-08-08
  note: "The original ~40% LLM F1 headline is not clean capability evidence. A later audit found severe author-injected prompt leakage in 13/24 verified contracts, including an Euler example whose header contained the exact label while the vulnerable function was absent from committed source. The article is revised in place and the historical score is treated as a contaminated upper bound; no paid sanitized rerun is claimed."
  primary: https://github.com/0xSoftBoi/anthropic-fellowship
  primary_label: BRIDGE-bench source + leakage audit
