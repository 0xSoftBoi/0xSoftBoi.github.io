<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip" href="#main">skip to content</a>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ '/' | relative_url }}">0xSoftBoi</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">writing</a>
        <a href="{{ '/tags/' | relative_url }}">tags</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="https://github.com/0xSoftBoi" target="_blank" rel="noopener noreferrer">github</a>
        <a href="https://twitter.com/0xSoftBoi" target="_blank" rel="noopener noreferrer">x</a>
      </div>
    </nav>
  </header>

  <main id="main" class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} 0xSoftBoi</span>
    <span><a href="https://suwappu.bot" target="_blank" rel="noopener noreferrer">suwappu.bot</a></span>
  </footer>

</html>
