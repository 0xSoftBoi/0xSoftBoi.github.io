---
layout: default
---
<article class="post">
  <a class="back" href="{{ '/blog/' | relative_url }}">← all posts</a>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>
  <div class="post-body">
    {{ content }}
  </div>
</article>
