amily="ui-monospace,monospace" font-size="12" fill="#66685f">SAME FINDINGS · DIFFERENT GRADER</text><text x="0" y="84" font-family="Georgia,serif" font-size="38" fill="#11120f">37.1%</text><text x="142" y="84" font-family="ui-sans-serif,system-ui" font-size="15" fill="#66685f">LLM judge</text><path d="M260 70H378" stroke="#2e5b4b" stroke-width="3"/><path d="M368 62l12 8-12 8" fill="none" stroke="#2e5b4b" stroke-width="3"/><text x="408" y="84" font-family="Georgia,serif" font-size="38" fill="#11120f">51.6%</text><text x="540" y="84" font-family="ui-sans-serif,system-ui" font-size="15" fill="#66685f">gold labels</text><text x="0" y="130" font-family="ui-sans-serif,system-ui" font-size="15" fill="#4d5047">Changing only the evaluator moved the score by 14.5 points.</text><text x="0" y="166" font-family="ui-sans-serif,system-ui" font-size="15" fill="#24473b">Clean paired remeasurement remains unclaimed.</text></g></svg>