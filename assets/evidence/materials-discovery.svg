<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Active materials discovery results</title><desc id="d">Bar chart comparing discovery acceleration for random, greedy, and low-weight UCB acquisition, plus uncertainty calibration showing negative correlation with error.</desc><rect width="720" height="420" fill="#f3f1eb"/><text x="54" y="48" font-family="ui-monospace,monospace" font-size="13" fill="#66685f">MATBENCH PEROVSKITES · 5% LABELING BUDGET</text><g transform="translate(54 82)"><text x="0" y="0" font-family="Georgia,serif" font-size="36" fill="#11120f">Discovery acceleration</text><line x1="0" y1="242" x2="360" y2="242" stroke="#bdb8ac"/><g><rect x="18" y="196" width="68" height="46" fill="#c9c5ba"/><rect x="130" y="8" width="68" height="234" fill="#6f8e81"/><rect x="242" y="7" width="68" height="235" fill="#2e5b4b"/></g><g font-family="ui-monospace,monospace" font-size="12" fill="#66685f"><text x="20" y="264">RANDOM</text><text x="132" y="264">GREEDY μ</text><text x="245" y="264">UCB λ=.5</text></g><g font-family="Georgia,serif" font-size="24" fill="#11120f"><text x="28" y="187">1.01×</text><text x="138" y="32">5.15×</text><text x="250" y="31">5.17×</text></g></g><g transform="translate(448 82)"><text x="0" y="0" font-family="Georgia,serif" font-size="30" fill="#11120f">Uncertainty failed</text><text x="0" y="29" font-family="ui-sans-serif,system-ui" font-size="15" fill="#4d5047">MC-dropout looked useful</text><text x="0" y="51" font-family="ui-sans-serif,system-ui" font-size="15" fill="#4d5047">until calibration.</text><rect x="0" y="82" width="210" height="118" fill="#e9e6de" stroke="#cfc8bb"/><text x="18" y="112" font-family="ui-monospace,monospace" font-size="12" fill="#66685f">Spearman σ vs |error|</text><text x="18" y="162" font-family="Georgia,serif" font-size="46" fill="#8b3f36">−0.47</text><text x="18" y="188" font-family="ui-sans-serif,system-ui" font-size="14" fill="#66685f">desired direction: positive</text><text x="0" y="238" font-family="ui-sans-serif,system-ui" font-size="15" fill="#24473b">Interpretation: useful μ and useful σ</text><text x="0" y="260" font-family="ui-sans-serif,system-ui" font-size="15" fill="#24473b">are separate achievements.</text></g></svg>